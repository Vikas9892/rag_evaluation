[tool.black]
# Black's default. Pinned rather than left implicit so a contributor with a
# different default cannot reformat the tree as a side effect of saving a file.
line-length = 88

[tool.ruff]
line-length = 88

[tool.ruff.lint]
# Pyflakes and pycodestyle errors only. This codebase was written without a
# linter, so turning on the full default set at once would bury the findings
# that matter — an undefined name, a shadowed test class — under style noise.
select = ["E", "F"]
# Formatting is black's job; E501 would only disagree with it about strings
# and comments that black cannot split.
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=short"
filterwarnings = [
    # An unclosed SQLite connection is a leak the suite should not tolerate:
    # it survives until the interpreter collects it, and on Windows it holds
    # the database file open against the tmp_path teardown that follows.
    # Scoped to the message so an unrelated ResourceWarning from a dependency
    # does not fail an unrelated test.
    "error:unclosed database:ResourceWarning",
]
markers = [
    "slow: marks tests as slow (model downloads, real I/O)",
    "integration: marks tests that require a live FAISS index",
]

[tool.coverage.run]
source = ["."]
omit = [
    "tests/*",
    "load_tests/*",
    "scripts/*",
    "docs/*",
    "*/site-packages/*",
    "setup.py",
    "conftest.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "class .*\\bProtocol\\b",
    "@(abc\\.)?abstractmethod",
]
show_missing = true
