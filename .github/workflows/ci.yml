name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  # Separate from the test job, and without the index build: linting needs
  # neither the model weights nor a FAISS index, and waiting ~90s for them to
  # report an unused import would discourage running it at all.
  lint:
    name: "Lint and format"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Pinned: black's stable style changes with the calendar year, and ruff
      # adds rules between releases. An unpinned install turns "someone else
      # shipped a new version" into a red build on an untouched tree.
      - name: Install the linters
        run: pip install ruff==0.15.20 black==26.5.1

      - name: Ruff
        run: python -m ruff check .

      - name: Black
        run: python -m black --check .

  # The frontend was local-only until now, which is how a committed file sat
  # failing `prettier --check` for days and how 359 tests came to depend on
  # somebody remembering to run them. Every backend failure this project has
  # had in CI shared that shape: a check that only ran where it could not fail.
  frontend:
    name: "Frontend"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `ci`, not `install`: it installs the lockfile exactly and fails if
      # package.json has drifted from it, which is the check worth having here.
      - name: Install dependencies
        run: npm ci

      # Regenerates the Next.js route types first, as `npm run typecheck` does
      # locally — without them tsc fails on a clean checkout.
      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

      # The end-to-end suite is deliberately absent. It drives a real browser
      # against a real API and a real index, so it would need the model weights
      # and both servers running — the Python job's setup, plus Playwright's, to
      # re-cover ground the unit suite already holds. It stays a local gate,
      # documented in the README.

  test:
    name: "Python ${{ matrix.python-version }}"
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-
            ${{ runner.os }}-pip-

      - name: Cache HuggingFace model weights
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: ${{ runner.os }}-hf-bge-small-en-v1.5
          restore-keys: |
            ${{ runner.os }}-hf-

      - name: Install dependencies
        run: pip install -r requirements.txt

      # The index is a build artefact, not source, so it is gitignored and a
      # fresh checkout has none. It still has to exist here: the ground-truth
      # integrity tests assert that every label in the shipped dataset resolves
      # to exactly one chunk of the *real* index, which is the invariant that
      # caught labels silently re-pointing when chunking changed (MRR 1.000 ->
      # 0.143, every test still green). Asserting it against a fixture would
      # test the fixture.
      - name: Build the index
        run: |
          python scripts/build_embeddings.py
          python scripts/build_index.py
        env:
          PYTHONPATH: .

      - name: Run tests with coverage
        run: |
          python -m pytest \
            --cov=. \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=85 \
            -q
        env:
          PYTHONPATH: .

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
